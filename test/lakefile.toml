name = "test"
defaultTargets = ["HtmlSyntaxTests"]
testDriver = "tests"

[leanOptions]
warningAsError = true

[[require]]
name = "html-syntax"
path = ".."

# Named here, with the lean-regular fix it requires, so that they win over the older versions that
# lean-html and lean-html-renderer lock.
[[require]]
name = "regular"
git = "https://github.com/paulbutcher/lean-regular"
rev = "v0.2.1"

[[require]]
name = "html-model"
git = "https://github.com/paulbutcher/lean-html-model"
rev = "v0.4.1"

[[require]]
name = "html-renderer"
git = "https://github.com/paulbutcher/lean-html-renderer"
rev = "v0.1.0"

[[require]]
name = "html"
git = "https://github.com/paulbutcher/lean-html"
rev = "v0.14.0"

[[lean_lib]]
name = "HtmlSyntaxTests"

[[lean_exe]]
name = "tests"
root = "Main"
